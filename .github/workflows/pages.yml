name: Deploy to GitHub Pages

# One Pages site, two builds (docs/TECH.md §9.1):
#   /shop-game/      the public game: the latest GitHub Release (npm run release)
#   /shop-game/dev/  the test build: the tip of main, on every push
# Every run rebuilds both, so either trigger leaves the other build as it was.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          path: src
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Find the latest release
        id: release
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          echo "Public game: ${tag:-main (no release yet)}"
          echo "ref=${tag:-main}" >> "$GITHUB_OUTPUT"
      - name: Public game (latest release) at /
        id: public
        working-directory: src
        run: |
          git worktree add --detach ../public "${{ steps.release.outputs.ref }}"
          cd ../public
          npm test
          node scripts/stamp.js ../_site "$(git rev-parse HEAD)" main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test build (main) at /dev/
        id: dev
        working-directory: src
        run: |
          npm test
          node scripts/stamp.js ../_site/dev "$(git rev-parse HEAD)" dev
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v6
      - id: artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # Pages skips a deploy whose build version it has already deployed, and actions/deploy-pages always
      # uses the triggering commit. A release of main's tip has the same commit as the push before it, so
      # this deploys through the API (what deploy-pages does) with a version made from both builds' commits.
      - id: deployment
        uses: actions/github-script@v9
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          BUILDS: ${{ steps.public.outputs.sha }} ${{ steps.dev.outputs.sha }}
        with:
          script: |
            const { createHash } = require('node:crypto');
            const version = createHash('sha1').update(process.env.BUILDS).digest('hex');
            const { owner, repo } = context.repo;
            const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: version,
              oidc_token: await core.getIDToken(),
            });
            core.info(`Deploying ${process.env.BUILDS} as ${version}`);
            core.setOutput('page_url', data.page_url);
            const id = data.id ?? data.status_url.split('/').pop();
            for (let i = 0; i < 120; i++) {
              await new Promise((r) => setTimeout(r, 5000));
              const { data: d } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id });
              core.info(`Status: ${d.status}`);
              if (d.status === 'succeed') return;
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(d.status)) {
                return core.setFailed(`Pages deployment ${d.status}`);
              }
            }
            core.setFailed('Pages deployment timed out');
