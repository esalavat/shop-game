<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#bfe3f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>My Dream Dollhouse Shop</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=9">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-row">
      <div class="pill" id="hud-coins"><span class="ico" aria-hidden="true">🪙</span><b>0</b></div>
      <div class="pill" id="hud-hearts"><span class="ico" aria-hidden="true">❤️</span><b>0</b></div>
      <div class="pill" id="hud-sparkle"><span class="ico" aria-hidden="true">✨</span><b>0</b></div>
    </div>
    <div class="day-chip"><span id="hud-day"></span><div class="day-bar"><div id="hud-day-fill"></div></div></div>
  </div>

  <div id="overlay"></div>
  <div id="toasts" aria-live="polite"></div>

  <div id="toolbar">
    <button id="btn-order"><span class="tb-ico" aria-hidden="true">📖</span>Order</button>
    <button id="btn-day"><span class="tb-ico" aria-hidden="true"></span><span class="tb-label"></span></button>
  </div>

  <div id="orderbook" class="sheet" hidden>
    <div class="sheet-body">
      <div class="sheet-head">
        <h2>Order Book</h2>
        <button class="close" aria-label="Close">✕</button>
      </div>
      <div class="pending"></div>
      <div class="cards"></div>
    </div>
  </div>

  <div id="boot-error" hidden>
    <div class="rotate-card">Oops! The shop didn't open properly.<br><button id="boot-reload">Reload</button></div>
  </div>

  <div id="summary" class="sheet" hidden>
    <div class="sheet-body">
      <div class="sheet-head">
        <h2 class="summary-title"></h2>
        <button class="close" aria-label="Close">✕</button>
      </div>
      <div class="summary-stats"></div>
      <div class="summary-section summary-sold"></div>
      <div class="summary-section summary-wishes"></div>
      <div class="summary-actions">
        <button class="summary-order">📖 Order for tomorrow</button>
        <button class="summary-next"></button>
      </div>
    </div>
  </div>

  <div id="rotate">
    <div class="rotate-card">📱<br>Turn your phone upright to play!</div>
  </div>
</div>
<script>
  // If the game hasn't started after a while (e.g. a file failed to load), offer a fresh reload
  // instead of leaving a blank screen.
  function showBootError() { if (!window.__booted) document.getElementById('boot-error').hidden = false; }
  setTimeout(showBootError, 10000);
  document.getElementById('boot-reload').addEventListener('click', function () {
    location.replace(location.pathname + '?fresh=' + Date.now());
  });
</script>
<script type="module" src="js/main.js?v=10" onerror="showBootError()"></script>
</body>
</html>
